<div class="confirmation-modal">
  <h3> {{ config.title }} </h3>
  <p [innerHTML]="config.caption"></p>
  <br>

    <div class="buttons">
      @for (button of config.buttons; track button) {
        <button mat-flat-button (click)="onClick(button.value)" [class]="button.color">{{button.title}}</button>
      }
    </div>
  </div>
