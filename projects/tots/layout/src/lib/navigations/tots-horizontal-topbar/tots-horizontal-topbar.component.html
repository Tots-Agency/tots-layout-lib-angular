<div class="toolbar_element">
  <div class="container container_low">

    @for (item of leftItems; track item) {
      <tots-base-item-navigation class="left" [item]="item"></tots-base-item-navigation>
    }

    @if (config?.hasSearch) {
      <div class="search" (click)="searchInput.click()">
        <mat-icon>search</mat-icon>
        <input #searchInput type="text" placeholder="Search here..." />
      </div>
    }

    @if (config?.hasSearch == undefined||config?.hasSearch == false) {
      <div class="search"></div>
    }

    @for (item of rightItems; track item) {
      <tots-base-item-navigation class="right" [item]="item"></tots-base-item-navigation>
    }

  </div>
</div>
