<a mat-button [routerLink]="data.path" routerLinkActive="tots_left_sidebar_button_item_active" class="tots_left_sidebar_button_item">

  @if (data.icon) {
    <mat-icon class="nav-item-icon">{{data.icon}}</mat-icon>
  }
  <span class="nav-item-title">{{data.title}}</span>

  @if (data.badge) {
    <div class="item-badge">
      <div class="badge-content"> {{data.badge}} </div>
    </div>
  }

</a>
