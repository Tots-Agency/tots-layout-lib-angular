<!-- Button -->
<button mat-icon-button class="btn-user" [matMenuTriggerFor]="userActions">
    @if (data.photo) {
        <img [src]="data.photo" [alt]="data.title" />
    } @else {
        <mat-icon>account_circle</mat-icon>
    }
</button>

<!-- Mat Menu -->
<mat-menu [xPosition]="'before'" #userActions="matMenu" class="menu-user">
    <div class="user-data-node">
        <span>{{data.title}}</span><br/>
    </div>

    @if (data.accounts && data.accounts.length > 0) {
        <div class="accounts-list">
            <mat-divider class="my-2"></mat-divider>
            <span class="change-account-span">Change account: </span>

            @for (account of accounts; track $index) {
                <button mat-menu-item (click)="onClickAccount(account)">
                    <mat-icon>store</mat-icon>
                    <span>{{account.title}}</span>
                </button>
            }

            @if (data.hasNewAccount) {
                <button mat-menu-item (click)="onClickNewAccount()">
                    <mat-icon>add_business</mat-icon>
                    <span>Add new account</span>
                </button>
            }

        </div>
    }

    <mat-divider class="my-2"></mat-divider>

    @for (menuItem of data.items; track $index) {
        <button mat-menu-item (click)="onClick(menuItem)">
            <mat-icon>{{menuItem.icon}}</mat-icon>
            <span>{{menuItem.title}}</span>
        </button>
    }
    
</mat-menu>
