<!-- Button -->
<button mat-icon-button class="btn-user" [matMenuTriggerFor]="userActions">
    @if (data.photo) {
        <img [src]="data.photo" [alt]="data.firstname+' '+data.lastname" />
    } @else {
        <mat-icon>account_circle</mat-icon>
    }
</button>

<!-- Mat Menu -->
<mat-menu [xPosition]="'before'" #userActions="matMenu" class="menu-user">
    <div class="user-data-node">
        <span>
            {{data.firstname}} {{data.lastname}}
        </span>
        <br/>
        <span class="mt-1.5 text-md font-medium">
            {{data.email}}
        </span>
    </div>

    <mat-divider class="my-2"></mat-divider>

    @for (menuItem of data.items; track $index) {
        <button mat-menu-item (click)="onClick(menuItem)">
            <mat-icon>{{menuItem.icon}}</mat-icon>
            <span>{{menuItem.title}}</span>
        </button>
    }
</mat-menu>
