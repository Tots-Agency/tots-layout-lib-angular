<div class="tots-breadcrumb body_2 mb_1">
    @for (item of items; track $index) {
        <span>
            @if ($index > 0) {
                <span class="divider">&nbsp;/&nbsp;</span>
            }
            @if (item.path == undefined) {
                {{item.title}}
            } @else {
                <a [routerLink]="item.path">{{item.title}}</a>
            }
        </span>
    }
</div>
